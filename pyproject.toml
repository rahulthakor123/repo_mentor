[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-mentor"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "pydantic-settings",
  "gitpython",
  "numpy",
  "ollama",
  "streamlit",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
api = ["fastapi", "uvicorn"]
claude = ["anthropic"]

[tool.setuptools.packages.find]
where = ["src"]